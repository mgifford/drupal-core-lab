# Cloud (DDEV Coder) proxy for the "before" frame: forwards the Coder app hostname for the
# drupal-compare-before project to the viewer's before proxy on the workspace (port 8101).
# Same keepalive/timeout settings as tools/compare/site/.ddev/nginx_full/compare.conf.

upstream compare_before {
    server host.docker.internal:8101;
    keepalive 64;
}

server {
    listen 80;
    server_name ~^drupal-compare-before--;
    location / {
        proxy_pass http://compare_before;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 4;
    }
}
