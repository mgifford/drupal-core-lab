# Cloud (DDEV Coder) proxy for the "after" frame: forwards the Coder app hostname for the
# drupal-compare-after project to the viewer's after proxy on the workspace (port 8102).
# Same keepalive/timeout settings as tools/compare/site/.ddev/nginx_full/compare.conf.

upstream compare_after {
    server host.docker.internal:8102;
    keepalive 64;
}

server {
    listen 80;
    server_name ~^drupal-compare-after--;
    location / {
        proxy_pass http://compare_after;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 4;
    }
}
