# Cloud (DDEV Coder): accept the viewer's Coder app hostname (drupal-compare--<workspace>--<owner>.coder.ddev.com)
# in addition to drupal-compare.ddev.site. Reuses the compare_viewer upstream defined in compare.conf.
server {
    listen 80;
    server_name ~^drupal-compare--;
    location / {
        proxy_pass http://compare_viewer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 4;
    }
}
