# Extra nginx config for the drupal-compare DDEV project (kept next to DDEV's own nginx-site.conf).
# Each hostname is forwarded to the Node server started by `node tools/compare/serve.mjs --ddev` on the host.
#
# Reliability: a Drupal page needs about 90 files. Opening a fresh connection to the host for each one
# stalled about 1% of requests for roughly 19 seconds (measured), which left frames blank. So: keep upstream
# connections open (keepalive), give up on a connect after 2 seconds, and retry (GET/HEAD only).

upstream compare_viewer {
    server host.docker.internal:8100;
    keepalive 64;
}

upstream compare_before {
    server host.docker.internal:8101;
    keepalive 64;
}

upstream compare_after {
    server host.docker.internal:8102;
    keepalive 64;
}

server {
    listen 80;
    listen 443 ssl;
    server_name drupal-compare.ddev.site;
    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;
    location / {
        proxy_pass http://compare_viewer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 4;
    }
}

