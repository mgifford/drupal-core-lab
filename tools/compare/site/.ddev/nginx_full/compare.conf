# Extra nginx config for the drupal-compare DDEV project (kept next to DDEV's own nginx-site.conf).
# Each hostname is forwarded to the Node server started by `node tools/compare/serve.mjs --ddev` on the host.

server {
    listen 80;
    listen 443 ssl;
    server_name drupal-compare.ddev.site;
    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;
    location / {
        proxy_pass http://host.docker.internal:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

