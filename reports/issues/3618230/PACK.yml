pack_version: 1

issue:
  nid: "3618230"
  title: "Adopt the ajax MessageCommand for file uploads"
  url: https://www.drupal.org/project/drupal/issues/3618230
  fork_branch: 3618230-adopt-the-ajax
  merge_request: "!16777"

sources:
  - url: https://www.drupal.org/project/drupal/issues/3618230
    note: "Issue page with comments #1 to #10 (status Postponed)"
    date: 2026-10-04
  - url: https://git.drupalcode.org/project/drupal/-/merge_requests/16777
    note: "Merge request !16777, opened, source branch 3618230-adopt-the-ajax, target branch main"
    date: 2026-10-04

summary: |
  Reported problem: ManagedFile::uploadAjaxCallback() renders status messages directly into the replaced widget prefix inside the insert AJAX command instead of using the AJAX MessageCommand (introduced in Drupal 8.8). This causes HTML filtering issues with inline icons (e.g. SVG icons stripped in Olivero, issue #3457067), relies on inline markup for screen reader announcements rather than aria-live, and hardcodes message placement inside the widget instead of giving the theme control over rendering.

  The merge request (!16777) alters ManagedFile::uploadAjaxCallback() to append a unique container (div with class file-upload-messages) in the widget prefix and sends error messages using MessageCommand targeted at that container via its wrapperQuerySelector.

  Open points: comment #10 notes that Olivero has been removed from core (#3595089) and asks whether this problem still occurs in the Default Admin theme. The issue is postponed for maintainer feedback.

review:
  status: draft
  generated_by: "Gemini (chat), from issue page #3618230 and MR !16777"
  unverified:
    - "Whether the error message renders properly in the Default Admin theme on current main"
    - "Whether the fix check (element .file-upload-messages) only exists in the DOM after triggering a server-side file upload error"
    - "Assistive technology live announcement behavior in different admin themes"

setup:
  - use: file_field_with_size_limit
    params:
      field: "attachment"
      label: "Attachment"
      limit: "1 KB"
      extensions: "txt"

variant:
  description: >-
    Open /node/add/article in both frames. Upload a .txt file larger than 1 KB to trigger the server-side file size upload error.
    Before: messages are server-rendered inside the replaced widget prefix directly without using MessageCommand wrapper elements.
    After (MR !16777): messages are delivered via the AJAX MessageCommand targeting a dedicated container with class file-upload-messages.
  pages:
    - /node/add/article
  login: true
  demo:
    start: /node/add/article
  steps:
    - text: "Article content type with a 1 KB size limit file field exists."
      how: recipe
    - text: "Open /node/add/article in both frames."
      how: mirror
    - text: "Prepare a .txt file on your local machine larger than 1 KB (for example 5 KB)."
      how: mirror
    - text: "In EACH frame, select the Attachment file input and upload the oversized file to trigger the server-side validation error AJAX callback."
      how: each
      lookFor: "Check if the error message is inserted into a dedicated file-upload-messages container."
  expected: "The file upload error is rendered using the AJAX MessageCommand targeting the file-upload-messages wrapper container."
  actual: "Before: messages are directly embedded in the widget prefix response. After: a div with class file-upload-messages is rendered and targeted by MessageCommand."
  checks:
    - use: element_exists
      kind: precondition
      params:
        selector: "input[type='file']"
        what: "The file input field on the article form"
    - use: element_exists
      kind: fix
      params:
        selector: ".file-upload-messages"
        what: "The message container added by MR !16777 for MessageCommand targeting"
    - use: no_js_errors
      kind: regression
  observe:
    - label: "An error message appears after uploading a file larger than 1 KB"
      expectBefore: true
      expectAfter: true
    - label: "The error message is rendered inside a dedicated file-upload-messages container"
      expectBefore: false
      expectAfter: true

notes: |
  The issue was created by fago and postponed pending information on how it behaves with the Default Admin theme following Olivero's removal.
  The MR changes ManagedFile::uploadAjaxCallback to output a wrapper container with an ID matching file-upload-messages-* and sends messages via MessageCommand targeting that selector.
