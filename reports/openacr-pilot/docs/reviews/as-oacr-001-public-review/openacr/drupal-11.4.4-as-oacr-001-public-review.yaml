title: Drupal 11.4.4 Standard Reference Installation — AS-OACR-001 Public Review Draft
product:
  name: Drupal 11.4.4 Standard Reference Installation — AS-OACR-001 Test Build
  version: 11.4.4
  description: >-
    A reproducible, local, core-only Drupal 11.4.4 Standard profile reference installation evaluated
    as a methodology test and published for community review. This artifact does not describe Drupal
    generally or make a whole-product conformance claim.
author:
  name: TBD
  email: tbd@example.invalid
report_date: "2026-08-23"
last_modified_date: "2026-08-24"
version: 2
catalog: 2.5-edition-wcag-2.2-en
notes: >-
  PUBLIC REVIEW DRAFT — METADATA INCOMPLETE; NOT ISSUED. All 55 WCAG 2.2 A/AA criteria have a
  sample-scoped outcome; confirmed failures prevent an AA conformance statement. Author identity,
  author contact, official report feedback ownership, issuer, and release approval remain unresolved.
  Alex Urevick-Ackelsberg maintains this independent pull-request review package. This review copy
  uses the repository documentation license; that choice is not a Drupal Association license or
  issuance decision. Catalog criterion 4.1.1 is omitted because it was removed from WCAG 2.2.
evaluation_methods_used: >-
  WCAG-EM 2.0 sample-scoped evaluation of 20 structured and 2 deterministic random page samples plus
  five complete processes. The full suite completed 22 of 22 Playwright page tests with 1,183
  forward and 1,161 reverse keyboard stops, 44 default/expanded axe runs, 66 viewport and
  text-spacing checks, and 88 full-page screenshots. An independent keyboard matrix completed 44
  desktop/mobile runs. Additional evidence includes driven live-region interaction, actual 200%
  Chrome browser zoom across all samples, native Safari plus VoiceOver, native macOS Voice Control,
  rendered DOM facts, Chrome accessibility trees, reflow checks, and retained manual resolution
  evidence. Windows screen readers, mobile screen readers, switch access, and actual Windows forced
  colors were unavailable.
legal_disclaimer: >-
  PUBLIC REVIEW DRAFT — NOT ISSUED. This review copy is based on the frozen AS-OACR-001 sample and
  evidence boundary. It is not a Drupal Association position, Mike Gifford approval,
  release-readiness decision, Section 508 report, or whole-product conformance claim.
license: CC-BY-SA-2.0
repository: https://github.com/mgifford/drupal-core
