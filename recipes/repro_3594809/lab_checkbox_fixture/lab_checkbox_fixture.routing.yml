lab_checkbox_fixture.form:
  path: '/admin/lab/checkboxes'
  defaults:
    _form: '\Drupal\lab_checkbox_fixture\Form\CheckboxFixtureForm'
    _title: 'Checkbox fixture'
  options:
    _admin_route: TRUE
  requirements:
    _permission: 'access administration pages'

lab_checkbox_fixture.dialog:
  path: '/admin/lab/checkboxes/dialog'
  defaults:
    _form: '\Drupal\lab_checkbox_fixture\Form\CheckboxDialogForm'
    _title: 'Checkboxes in a dialog'
  options:
    _admin_route: TRUE
  requirements:
    _permission: 'access administration pages'
