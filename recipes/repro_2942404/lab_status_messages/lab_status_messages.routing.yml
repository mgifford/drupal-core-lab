lab_status_messages.page:
  path: '/lab/status-messages'
  defaults:
    _controller: '\Drupal\lab_status_messages\Controller\StatusMessagesController::page'
    _title: 'Status messages'
  requirements:
    _permission: 'access content'

lab_status_messages.admin_page:
  path: '/admin/lab/status-messages'
  defaults:
    _controller: '\Drupal\lab_status_messages\Controller\StatusMessagesController::page'
    _title: 'Status messages (administration theme)'
  options:
    _admin_route: TRUE
  requirements:
    _permission: 'access administration pages'
