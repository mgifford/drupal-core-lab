name: 'Repro: #3587661 Display checkbox in the multiple-value file widget has no label'
description: 'Article with one file field that allows two values and has "Enable Display field" on. The Image field is hidden on the form, so this is the only upload.'
type: Testing
recipes:
  - core/tests/fixtures/recipes/article_content_type
install:
  - file
  - node
config:
  actions:
    core.entity_form_display.node.article.default:
      setComponents:
        -
          name: field_files_two
          options:
            type: file_generic
            weight: 10
            settings:
              progress_indicator: throbber
      hideComponent: field_image
