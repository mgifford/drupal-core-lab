# Settings for agents and tools that work in this repository (read by `node scripts/lab-config.mjs`).
# Change a value here to change it for everyone. Only keys that this file's reader knows are accepted; a typo is an error, not a guess.

auto_fix:
  # After opening a pull request, an agent turns on CI auto-fix for it (the desktop app's "Auto-fix pull requests"), so failing checks,
  # merge conflicts and review comments are handled without a person asking each time. Set to false to leave it off.
  # It can also be switched off for one pull request in the app's CI popover.
  # Either way an auto-fix is never silent: its commits say so, and a patch file it changes is recorded in
  # reports/issues/<nid>/PATCH-CHANGES.md with the original kept (see "Auto-fix" in AGENTS.md).
  enabled: true
