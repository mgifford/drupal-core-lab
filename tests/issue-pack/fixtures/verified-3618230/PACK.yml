pack_version: 1

issue:
  nid: "3618230"
  title: "Adopt the ajax MessageCommand for file uploads"
  url: https://www.drupal.org/project/drupal/issues/3618230
  fork_branch: 3618230-adopt-the-ajax
  merge_request: "!16777"

sources:
  - url: https://www.drupal.org/project/drupal/issues/3618230
    note: "Issue page with comments #1 to #10, status Postponed"
    date: 2026-10-02
  - url: https://git.drupalcode.org/project/drupal/-/merge_requests/16777
    note: "Merge request !16777, source branch 3618230-adopt-the-ajax, target branch main"
    date: 2026-08-20

summary: |
  Reported problem: ManagedFile::uploadAjaxCallback() renders a status_messages element into the replaced widget's prefix and ships it inside the insert AJAX command. This causes server-rendered messages to go through XSS filtering (stripping things like Olivero's SVG message icon, related to issue #3457067), prevents proper accessibility aria live announcements, forces errors inside the widget instead of the theme's message region, and complicates decoupled frontends.

  The changed code runs in server-side validation after an AJAX upload. Note that a disallowed file extension is rejected in the browser before any request, so it does not reach this code; thus using an oversized allowed extension (.txt exceeding 1 KB) triggers the server-side size validation.

  The merge request (!16777) updates core/modules/file/src/Element/ManagedFile.php to use a placeholder container div (file-upload-messages) in the replaced markup and delivers messages using the dedicated MessageCommand via Drupal::messenger()->deleteAll(). It also adds a kernel test in core/modules/file/tests/src/Kernel/ManagedFileTest.php.

  Comment #10 notes that Olivero has not been in core since #3595089 and asks whether the problem occurs in the Default Admin theme.

review:
  status: draft
  generated_by: "AI collaborator from the issue page and MR diff on 2026-10-03"
  unverified:
    - "Whether the problem still occurs in the Default Admin theme following the removal of Olivero from core"
    - "Whether decoupled frontends correctly receive and render the AJAX message command"
    - "The fix check (.file-upload-messages element) is false before any upload and can only be true on After after a failed upload."
    - "The recipe config was supplied by the person and not checked by you."

recipe:
  name: repro_3618230
  files:
    recipe.yml: |
      name: 'Repro: #3618230 Adopt the ajax MessageCommand for file uploads'
      description: 'Starting state for the steps to reproduce: the Article content type has an optional file field with a 1 KB size limit, shown on the node form, so a larger file triggers the upload error. Safe to apply more than once.'
      type: 'Testing'
      recipes:
        - core/tests/fixtures/recipes/article_content_type
      install:
        - file
        - node
      config:
        actions:
          core.entity_form_display.node.article.default:
            setComponent:
              name: field_attachment
              options:
                type: file_generic
                weight: 10
                settings:
                  progress_indicator: throbber
    config/field.storage.node.field_attachment.yml: |
      langcode: en
      status: true
      dependencies:
        module:
          - file
          - node
      id: node.field_attachment
      field_name: field_attachment
      entity_type: node
      type: file
      settings:
        target_type: file
        display_field: false
        display_default: false
        uri_scheme: public
      module: file
      locked: false
      cardinality: 1
      translatable: true
      indexes: {  }
      persist_with_no_fields: false
      custom_storage: false
    config/field.field.node.article.field_attachment.yml: |
      langcode: en
      status: true
      dependencies:
        config:
          - field.storage.node.field_attachment
          - node.type.article
        module:
          - file
      id: node.article.field_attachment
      field_name: field_attachment
      entity_type: node
      bundle: article
      label: Attachment
      description: ''
      required: false
      translatable: false
      default_value: {  }
      default_value_callback: ''
      settings:
        handler: 'default:file'
        handler_settings: {  }
        file_directory: '[date:custom:Y]-[date:custom:m]'
        file_extensions: txt
        max_filesize: '1 KB'
        description_field: false
      field_type: file

variant:
  description: >
    Upload a .txt file larger than 1 KB (for example 2 KB) in the Attachment field on a node form in both frames.
    Before: error message renders inside the file widget via standard insert AJAX command, bypassing theme message handling and aria live announcements.
    After (MR !16777): error messages are delivered via the dedicated AJAX MessageCommand into a placeholder wrapper.
  pages:
    - /node/add/article
  login: true
  demo:
    start: /node/add/article
  steps:
    - text: "The Article content type has an optional file field called Attachment, limited to 1 KB and .txt only."
      how: recipe
    - text: "Open /node/add/article in both frames."
      how: mirror
    - text: "Choose a .txt file larger than 1 KB (for example 2 KB) in the Attachment field in EACH frame. A file chooser cannot be mirrored, so do this by hand."
      how: each
      lookFor: "Before: error message renders inside the widget. After: message is delivered via MessageCommand targeting the file upload messages wrapper."
  expected: "Error messages during file upload are delivered via the AJAX MessageCommand instead of being baked into the replaced widget markup."
  actual: "Before, status messages are server-rendered inside the widget via insert command. After (MR !16777), MessageCommand is used."
  checks:
    - label: "File upload input element is present on the node form"
      probe: "document.querySelector('input[type=\"file\"]') !== null"
      expect: true
      kind: precondition
    - label: "The file upload messages wrapper element exists"
      probe: "document.querySelector('.file-upload-messages') !== null"
      expect: true
      kind: fix
    - label: "JavaScript errors on the page"
      probe: "(window.__cmpErrors || []).length"
      expect: 0
      kind: regression
  observe:
    - label: "Error message appears when uploading an oversized file"
      expectBefore: true
      expectAfter: true
    - label: "Error message uses the dedicated message container or AJAX MessageCommand structure"
      expectBefore: false
      expectAfter: true

notes: "The issue is currently postponed (maintainer needs more info regarding Olivero removal in core #3595089)."
