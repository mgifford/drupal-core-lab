recipe:
  name: "repro_3618230"
  files:
    recipe.yml: |
      name: 'Repro: #3618230 Managed file upload messages'
      description: 'The required managed file field and upload-size configuration have not been identified in the supplied sources; see review.unverified.'
      type: 'Testing'
      recipes: []

variant:
  description: >-
    Attempt to upload a file that exceeds the managed file field's configured upload limit. The reported Before behaviour is that the error appears inside the widget and the page message region stays empty. MR !16777 routes the message through a MessageCommand targeting a container in the replaced widget markup. The setup is not yet reproducible from the supplied core-only recipe information, so use this as a draft scenario pending a deterministic recipe.
  pages:
    - "/node/add/article"
  login: true
  demo:
    start: "/node/add/article"
  steps:
    - text: "The required article content type, managed file field, and upload-size limit are not established by this recipe; the issue sources do not specify a core recipe or configuration action for them."
      how: recipe
    - text: "Open the article form in both frames and locate its managed file upload control."
      how: mirror
      lookFor: "Confirm that the form exposes the same managed file field in both frames."
    - text: "In each frame, upload a file whose size exceeds the managed file field's configured limit. Select the file manually in each frame."
      how: each
      lookFor: "Observe where the upload error appears and whether a message is inserted into the page message region."
  expected: "An oversized upload produces an error message through the managed-file AJAX response. The sources do not report a change to the placement: MR !16777 retains the message within the widget."
  actual: "The issue summary reports that on Drupal 11.4 with Olivero, an oversized upload error appears inside the widget and the page message region stays empty. Whether this reproduces on current core with Default Admin is unanswered in comment #10."
  checks: []
  observe:
    - label: "Does uploading a file over the configured limit show an error inside the managed file widget?"
      expectBefore: true
      expectAfter: true
    - label: "Does uploading a file over the configured limit leave the page message region empty?"
      expectBefore: true
      expectAfter: true

notes: |
  No automated probe is included. The supplied sources do not establish a recipe that creates the file field and its upload limit, and the placement retained by the MR is within the widget. The central change is the response mechanism for queued messages: an insert command replaces widget markup, then MessageCommand commands target a container inside that markup. The issue's claim about accessible live announcements is not a conformance finding and has not been verified here.
