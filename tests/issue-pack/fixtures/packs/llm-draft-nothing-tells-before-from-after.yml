summary: |
  Reported problem: ManagedFile::uploadAjaxCallback() renders status messages into the replaced file widget markup and returns that markup through an AJAX insert command. The issue summary says this can cause message markup such as Olivero's SVG icon to be stripped by XSS filtering, does not use the AJAX message command's live announcement handling, and places upload errors inside the widget rather than the theme message region. The issue's reproduction report is Drupal 11.4 with Olivero and a file field: uploading a file over the limit shows the error inside the widget and leaves the page message region empty (issue summary). This is a server-side managed-file AJAX callback path, not a browser-side file-size validation path.

  MR !16777 stops rendering status messages into the replaced markup. It adds a uniquely identified message container to the callback's output, deletes queued messenger messages, and adds one MessageCommand per message targeting that container, with the existing in-widget placement retained for backwards compatibility (MR diff). The new kernel test checks the response command sequence and that a messenger error is consumed (MR diff). The MR's proposed placement does not test placement in the theme message region.

  The issue is Postponed. Comment #10 (2026-10-02) asks whether the reported problem occurs in Default Admin because Olivero has been removed from core. No answer or current-core reproduction with Default Admin is included in the supplied issue text. Comment #9 says Guidepup runs and AI-generated tests were added, but the supplied MR diff contains only the kernel test shown here.

  The repro below exercises the reported oversized-upload path. The supplied sources do not identify a core recipe that creates a file field with an upload size limit, nor the configuration needed to set that limit. The recipe therefore does not claim to create the complete state; those setup details must be resolved before the lab can run this recipe reliably.

