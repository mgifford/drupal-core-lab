recipe:
  name: repro_3618230
  files:
    recipe.yml: |
      name: 'Repro: #3618230 Adopt ajax MessageCommand for file uploads'
      description: 'Adds an Article content type with a file field to test managed file AJAX uploads.'
      type: 'Testing'
      recipes:
        - core/tests/fixtures/recipes/article_content_type

variant:
  description: >-
    Upload a file exceeding the size limit on a node form using a managed file field, in both frames.
    Before: the error message is rendered inside the widget via an insert command.
    After (MR !16777): the error message is delivered using the AJAX MessageCommand.
  pages:
    - /node/add/article
  login: true
  demo:
    start: /node/add/article
  steps:
    - text: "Article content type with a file field is available."
      how: recipe
    - text: "Open /node/add/article in both frames."
      how: mirror
    - text: "Upload a file that exceeds the upload size limit using the file field upload button, in each frame."
      how: each
      lookFor: "Observe where and how the error message is rendered."
  expected: "Error messages are delivered via the AJAX MessageCommand targeting the message wrapper container."
  actual: "Before, error messages are server-rendered inside the widget via the insert command."
  checks:
    - label: "Managed file upload callback uses MessageCommand"
      probe: "true"
      expect: true
      kind: precondition
  observe:
    - label: "Error message is rendered via AJAX MessageCommand rather than server-rendered HTML inside the insert command"
      expectBefore: false
      expectAfter: true

notes: |
  The merge request introduces a kernel test (ManagedFileTest::testUploadAjaxCallbackMessages) which verifies that the AJAX response contains a message command instead of rendering the error directly inside the insert command data.