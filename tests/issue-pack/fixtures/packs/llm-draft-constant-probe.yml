summary: |
  Reported problem: ManagedFile::uploadAjaxCallback() renders a status_messages element into the replaced widget's #prefix and sends it inside the insert AJAX command. This causes issues with XSS filtering stripping things like theme icons (e.g., Olivero's SVG message icon), lacks proper aria-live accessibility announcements, places errors inside the file widget rather than the theme message region, and complicates decoupled rendering.
  
  The merge request (!16777) modifies ManagedFile.php to use a placeholder container for file upload messages and delivers messages using the dedicated AJAX MessageCommand instead of baking them into the replaced markup. It also adds a kernel test in ManagedFileTest.php.
  
  Open points from the discussion: comment #10 notes that Olivero has been removed from core via issue #3595089, and asks whether this problem occurs in the Default Admin theme.

