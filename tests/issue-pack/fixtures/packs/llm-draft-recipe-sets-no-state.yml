    date: 2026-08-20

summary: |
  Reported problem: ManagedFile::uploadAjaxCallback() renders a status_messages element into the replaced widget's prefix and ships it inside the insert AJAX command. This causes server-rendered messages to go through XSS filtering (stripping things like Olivero's SVG message icon, related to issue #3457067), prevents proper accessibility aria live announcements, forces errors inside the widget instead of the theme's message region, and complicates decoupled frontends.

  The merge request (!16777) updates core/modules/file/src/Element/ManagedFile.php to use a placeholder container div (file-upload-messages) in the replaced markup and delivers messages using the dedicated MessageCommand via Drupal::messenger()->deleteAll(). It also adds a kernel test in core/modules/file/tests/src/Kernel/ManagedFileTest.php.

  Comment #10 notes that Olivero has not been in core since #3595089 and asks whether the problem occurs in the Default Admin theme.

review:
  status: draft
  generated_by: "AI collaborator from the issue page and MR diff on 2026-10-03"
  unverified:
    - "Whether the problem still occurs in the Default Admin theme following the removal of Olivero from core"
    - "Whether decoupled frontends correctly receive and render the AJAX message command"

recipe:
  name: repro_3618230
  files:
    recipe.yml: |
      name: "Repro: #3618230 Adopt ajax MessageCommand for file uploads"
      description: "Adds an Article content type with a file field to test upload error message handling."
      type: "Testing"
      recipes:
        - core/tests/fixtures/recipes/article_content_type

variant:
  description: >
    Upload a file exceeding the size limit on a node form using a file field in both frames.
    Before: error message renders inside the file widget via standard insert AJAX command, bypassing theme message handling and aria live announcements.
    After (MR !16777): error messages are delivered via the dedicated AJAX MessageCommand into a placeholder wrapper.
  pages:
    - /node/add/article
  login: true
  demo:
    start: /node/add/article
  steps:
    - text: "Article content type exists with a file field."
      how: recipe
    - text: "Open /node/add/article in both frames."
      how: mirror
    - text: "Upload a file that exceeds the configured file size limit using the file field upload control in EACH frame. A file chooser cannot be mirrored, so do this by hand."
      how: each
      lookFor: "Before: error message renders inside the widget. After: message is delivered via MessageCommand targeting the file upload messages wrapper."
  expected: "Error messages during file upload are delivered via the AJAX MessageCommand instead of being baked into the replaced widget markup."
  actual: "Before, status messages are server-rendered inside the widget via insert command. After (MR !16777), MessageCommand is used."
  checks:
    - label: "File upload input element is present on the node form"
      probe: "document.querySelector('input[type=\"file\"]') !== null"
      expect: true
      kind: precondition
    - label: "JavaScript errors on the page"
      probe: "(window.__cmpErrors || []).length"
      expect: 0
      kind: regression
  observe:
    - label: "Error message appears when uploading an oversized file"
      expectBefore: true
      expectAfter: true
    - label: "Error message uses the dedicated message container or AJAX MessageCommand structure"
      expectBefore: false
      expectAfter: true

notes: "The issue is currently postponed (maintainer needs more info regarding Olivero removal in core #3595089)."
