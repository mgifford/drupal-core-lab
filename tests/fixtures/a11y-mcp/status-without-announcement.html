<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status message that is not announced</title>
<!--
  Control 4: clicking Save writes "Saved" into a plain <div>: no role, no aria-live, no focus move. Nothing changes at
  page load. The change is a silent change in the recorder evidence and a candidate for WCAG 2.2 SC 4.1.3 Status
  Messages: https://www.w3.org/TR/WCAG22/#status-messages
-->
<style>
  body { margin: 2rem; font-family: system-ui, sans-serif; color: #1a1a1a; background: #ffffff; }
  h1 { font-size: 1.5rem; }
  button { font: inherit; padding: 0.4rem 0.9rem; background: #0b4fbf; color: #ffffff; border: 2px solid #0b4fbf; border-radius: 4px; }
  #save-status { min-height: 1.5rem; margin-top: 1rem; font-weight: 600; }
</style>
</head>
<body>
<h1>Status message that is not announced</h1>
<p>Click Save: a confirmation appears in a plain div, with no live region, no role and no focus move.</p>
<p><button type="button" id="save">Save</button></p>
<!-- Deliberately a plain div: no role="status", no aria-live, and focus does not move to it. -->
<div id="save-status"></div>
<script>
  document.getElementById('save').addEventListener('click', () => {
    document.getElementById('save-status').textContent = 'Saved';
  });
</script>
</body>
</html>
