# Evidence publication budgets. Warn-only: the report names what is over budget, and nothing is deleted or automatically
# untracked. These are starting points for discussion, not hard limits. See docs/EVIDENCE-BUDGET.md.
mode: warn

limits:
  max_files_per_issue: 100
  max_bytes_per_issue: 5242880
  max_bytes_per_json: 262144
  max_images_per_run: 8
