name: Weekly issue status and focus

# Reads each issue's status (archived ones too, to spot a reopened issue) on drupal.org and its merge request on git.drupalcode.org (read-only: nothing is posted), rebuilds
# reports/issues/README.md and reports/issues/FOCUS.md, and opens one pull request with what changed, for a person to review and
# merge. The focus report ranks the issues that need review first, then RTBC, needs work, watch and close-out. Mondays, and on
# demand (Actions > Weekly issue status and focus > Run workflow). See docs/ISSUE-LIFECYCLE.md.
# Needs Settings > Actions > General > Workflow permissions > "Allow GitHub Actions to create and approve pull requests".
# Its pull request only changes files under reports/issues/ and gets the usual self-test and cloud checks: let them finish (about a
# minute) before merging.
on:
  schedule:
    - cron: '17 7 * * 1'   # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: issue-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read every issue, archived too (read-only)
        id: read
        run: |
          set +e
          node scripts/issue-status.mjs --all --write --include-archived 2>&1 | tee status.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Rebuild the issue list
        run: node scripts/index-issues.mjs
      - name: Build the focus report
        run: node scripts/focus-issues.mjs --write
      - name: Add the focus summary to the job page
        run: node scripts/focus-issues.mjs --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild cloud/
        run: node scripts/build-cloud.mjs
      - name: Open a pull request with what changed
        env:
          GH_TOKEN: ${{ github.token }}
          LIST_URL: ${{ github.server_url }}/${{ github.repository }}/blob
        run: |
          if [ -z "$(git status --porcelain -- reports/issues cloud)" ]; then echo "No issue changed since the last check."; exit 0; fi
          day=$(date -u +%F); branch="issue-status/${day}-${{ github.run_number }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- reports/issues cloud
          git commit -q -m "Issue status and focus: weekly check ${day}" -m "Read-only check of drupal.org and git.drupalcode.org by .github/workflows/issue-status.yml."
          git push -q -u origin "$branch"
          node scripts/focus-issues.mjs --summary > focus.md
          {
            echo "Weekly read-only check of every issue, including archived ones so a reopened issue is noticed (\`node scripts/issue-status.mjs --all --write --include-archived\`), then \`node scripts/index-issues.mjs\`, \`node scripts/focus-issues.mjs --write\` and \`node scripts/build-cloud.mjs\`. Nothing was posted anywhere."
            echo
            echo "Where to focus: [reports/issues/FOCUS.md](${LIST_URL}/${branch}/reports/issues/FOCUS.md). The full issue list is [reports/issues/README.md](${LIST_URL}/${branch}/reports/issues/README.md); what each next step means: docs/ISSUE-LIFECYCLE.md."
            echo
            cat focus.md
            echo
            echo '```'
            tail -n 60 status.log
            echo '```'
          } > body.md
          gh pr create --base main --head "$branch" --title "Issue status and focus: weekly check ${day}" --body-file body.md
      - name: Fail when an issue could not be read
        if: steps.read.outputs.exit != '0'
        run: |
          echo "::error::Some issues could not be read from drupal.org or git.drupalcode.org (see the first step). The pull request, if any, holds the others."
          exit 1
