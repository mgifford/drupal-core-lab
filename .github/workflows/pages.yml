name: Publish cloud/ to GitHub Pages

# cloud/ is generated by scripts/build-cloud.mjs and committed; this only publishes it.
# In the repository settings, set Pages > Source to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['cloud/**', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cloud/
      - id: deployment
        uses: actions/deploy-pages@v4
