name: Check cloud/ is up to date

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-cloud.mjs --check
