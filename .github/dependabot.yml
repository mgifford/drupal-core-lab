# Dependabot for this lab repository (not the old mgifford/drupal-core fork).
# Only the lab's own Node tooling is tracked: Playwright, axe, gifenc and pngjs live in tools/playwright (dev tooling, never shipped).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/tools/playwright"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      playwright-tooling:
        patterns:
          - "*"
