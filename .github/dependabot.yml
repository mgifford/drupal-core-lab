# Dependabot for this lab repository (not the old mgifford/drupal-core fork).
# Tracked: the lab's own Node tooling (Playwright, axe, gifenc and pngjs live in tools/playwright; dev tooling, never shipped), and the
# GitHub Actions the workflows use (two of them can write: the weekly issue check and the Pages deploy).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/tools/playwright"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      playwright-tooling:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
